    <title>Hohoho</title>
    <!--
      Placeholder only.

      `server.url` in capacitor.config.ts points the WebView straight at the
      Project 3 deployment, so this file is never rendered in normal use — the
      Capacitor CLI just requires webDir to exist and contain an index.html.

      If the server is unreachable, Android shows its own WebView error page.
      To replace that with a branded screen, add `errorPath: "index.html"` under
      `server` in capacitor.config.ts (supported on recent Capacitor versions;
      drop the line again if `npx cap sync` rejects it).
    -->
